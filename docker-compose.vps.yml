# Authoritative VPS stack. Deploy with --env-file .env.vps -f docker-compose.vps.yml.
# Host networking preserves PostgreSQL/Redis/MinIO host-loopback connections.
# The observed Caddy path requires Node to listen beyond loopback.
# HOST is deliberately fixed here; env_file must not override the topology.
# SECURITY: 0.0.0.0 on the host requires TCP/3000 firewall protection BEFORE
# recreation. See docs/deployment/vps.md and deploy/vps-api-guard.nft.example.
# Staging naming preserves the existing loopback data-service configuration.

name: kode-platform-vps

services:
  postgres:
    image: postgres:17
    container_name: kode-vps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kode_platform_staging
      POSTGRES_USER: kode_staging
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kode_vps_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kode_staging -d kode_platform_staging"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: kode-vps-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - kode_vps_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - default
      - media-private

  minio:
    image: pgsty/minio:latest
    container_name: kode-vps-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - kode_vps_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - media-private

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kode-vps-api
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.vps
    environment:
      # Dockerfile defaults APP_ENV=production; override for loopback cutover.
      APP_ENV: staging
      NODE_ENV: staging
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  content-studio-upload-maintenance:
    build:
      context: .
      dockerfile: Dockerfile
      target: content-studio-upload-maintenance
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.vps
    environment:
      APP_ENV: staging
      NODE_ENV: staging
      CONTENT_STUDIO_UPLOAD_MAINTENANCE_INTERVAL_SECONDS: 300
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  media-worker:
    profiles: [media]
    build:
      context: .
      dockerfile: Dockerfile
      target: media-worker
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.vps
    environment:
      APP_ENV: staging
      NODE_ENV: staging
    cpus: 1.5
    mem_limit: 1536m
    pids_limit: 128
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=4294967296,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  media-platform-worker:
    # Slice 3: start exactly one worker after auth/edge canary, never --profile media.
    # docker compose --env-file .env.vps -f docker-compose.vps.yml up -d --no-deps --scale media-platform-worker=1 media-platform-worker
    profiles: [media-processing]
    build:
      context: .
      dockerfile: Dockerfile
      target: media-platform-worker
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.vps
    environment:
      APP_ENV: staging
      NODE_ENV: staging
      # New-worker credentials only; generic MinIO services are unchanged.
      MINIO_ACCESS_KEY: ${MEDIA_WORKER_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MEDIA_WORKER_SECRET_KEY:-}
      TMPDIR: /scratch
    volumes:
      - kode_media_worker_scratch:/scratch
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    cpus: 1.5
    mem_limit: 1536m
    pids_limit: 128
    stop_grace_period: 45s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  media-auth:
    # Slice 2 canary: up -d --no-deps media-auth media-edge only, after real MEDIA_ORIGIN_* exist.
    profiles: [media]
    build:
      context: .
      dockerfile: Dockerfile
      target: media-auth
    restart: unless-stopped
    environment:
      APP_ENV: staging
      MEDIA_AUTH_PORT: 3200
      MEDIA_PLAYBACK_SIGNING_SECRET: ${MEDIA_PLAYBACK_SIGNING_SECRET:?MEDIA_PLAYBACK_SIGNING_SECRET is required}
      MEDIA_ORIGIN_ENDPOINT: http://minio:9000
      MEDIA_ORIGIN_BUCKET: content-review-assets
      MEDIA_ORIGIN_ACCESS_KEY: ${MEDIA_ORIGIN_ACCESS_KEY:?Dedicated read-only media origin key required}
      MEDIA_ORIGIN_SECRET_KEY: ${MEDIA_ORIGIN_SECRET_KEY:?Dedicated read-only media origin secret required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      REDIS_TLS: "false"
    networks:
      - media-private
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25

  media-edge:
    profiles: [media]
    build:
      context: ./deploy/media-edge
    image: kode-media-edge:local
    entrypoint: [nginx, -g, "daemon off;"]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
    user: "101:101"
    ports:
      - "127.0.0.1:3100:8080"
    volumes:
      - ./deploy/media-edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/media-edge/media-cors.conf:/etc/nginx/media-cors.conf:ro
      - kode_media_edge_cache:/var/cache/nginx/media
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1777
      - /var/run:size=1048576,mode=0755
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      - default
      - media-private

networks:
  media-private:
    driver: bridge
    internal: true

volumes:
  kode_media_edge_cache:
  kode_media_worker_scratch:
  kode_vps_postgres_data:
  kode_vps_redis_data:
  kode_vps_minio_data:
