# Production topology example only.
# Do not use docker-compose.yml (development) for production.
# Do not put real passwords in this file.
# HTTPS is terminated at the reverse proxy, not by claiming this file is live.
#
# Public:
#   reverse proxy (HTTPS)
# Private docker network:
#   kode API, PostgreSQL, Redis, MinIO
#
# TRUSTED_PROXY_IPS must be the reverse proxy address on the private network.
# Never set TRUSTED_PROXY_IPS=0.0.0.0/0.
#
# Postgres/Redis/MinIO TLS in a real deployment should come from managed
# private services or mounted certificates. The API requires DATABASE_SSL=true,
# REDIS_TLS=true, and an https:// MinIO endpoint when APP_ENV=production.

name: kode-platform-production-example

services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      KODE_API_DOMAIN: ${KODE_API_DOMAIN:-api.example.invalid}
    volumes:
      - ./deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    networks:
      - public
      - private
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /data
      - /config
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${KODE_PRODUCTION_ENV_FILE:-.env.production.example}
    environment:
      APP_ENV: production
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      ALLOW_PRODUCTION: ${ALLOW_PRODUCTION:-false}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-10.0.0.1}
    expose:
      - "3000"
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - private
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kode_platform_production
      POSTGRES_USER: kode_production
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-REPLACE_WITH_RUNTIME_SECRET}
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
    networks:
      - private
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-REPLACE_WITH_RUNTIME_SECRET}
    volumes:
      - production_redis_data:/data
    networks:
      - private
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  minio:
    # Pin a specific official MinIO release or digest at deploy time.
    # Do not use :latest. Development compose retains the currently working
    # local image so existing volumes are not disrupted.
    image: minio/minio:REPLACE_WITH_PINNED_RELEASE
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-REPLACE_WITH_RUNTIME_SECRET}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-REPLACE_WITH_RUNTIME_SECRET}
    volumes:
      - production_minio_data:/data
    networks:
      - private
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  public:
  private:
    internal: true

volumes:
  production_postgres_data:
  production_redis_data:
  production_minio_data:
