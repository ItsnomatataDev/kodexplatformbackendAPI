worker_processes auto;
pid /tmp/nginx.pid;
# Nginx error messages can contain both bearer paths and origin signatures.
# Use the sanitized access log for status/latency monitoring.
error_log /dev/null;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    log_format media_safe '$status $request_method $body_bytes_sent $request_time $upstream_cache_status';
    access_log /dev/stdout media_safe;
    server_tokens off;
    proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:16m
        max_size=2g inactive=24h use_temp_path=off;
    map $upstream_status $uncacheable_status { default 1; 200 0; }
    map $media_cache_key $missing_cache_key { default 0; "" 1; }
    map $http_range $range_request { default 1; "" 0; }
    server {
        listen 8080;
        server_name _;
        client_max_body_size 1k;
        client_header_timeout 10s;
        client_body_timeout 10s;
        send_timeout 30s;
        keepalive_timeout 15s;
        add_header Cache-Control 'private, no-store' always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "media-edge-ok\n";
        }
        location = /_media_auth {
            internal;
            set $auth_backend media-auth:3200;
            proxy_pass http://$auth_backend/authorize;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_pass_request_headers off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_cache off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }
        location /media/v1/ {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            # Access phase runs for every request, including cache hits.
            auth_request /_media_auth;
            auth_request_set $media_origin_uri $upstream_http_x_media_origin_uri;
            auth_request_set $media_cache_key $upstream_http_x_media_cache_key;
            proxy_set_header Host minio:9000;
            # Signer signs GET. Nginx suppresses body for client HEAD.
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_pass_request_headers off;
            proxy_set_header Content-Length "";
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_pass http://minio:9000$media_origin_uri;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 10s;
            proxy_cache media;
            proxy_cache_key $media_cache_key;
            proxy_cache_bypass $range_request $missing_cache_key;
            proxy_no_cache $range_request $missing_cache_key $uncacheable_status;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            # Fixed object keys are currently mutable on worker retry. Keep
            # all VOD objects short-lived until generation fencing exists.
            proxy_cache_valid 200 30s;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Set-Cookie;
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-id-2;
            proxy_hide_header Location;
            proxy_intercept_errors on;
            error_page 301 302 303 307 308 500 502 503 504 = @media_unavailable;
            error_page 401 403 = @media_forbidden;
            error_page 400 404 = @media_missing;
            error_page 416 = @media_range;
            add_header Cache-Control 'private, no-store' always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Media-Cache $upstream_cache_status always;
        }
        # Never forward S3 XML errors (which may echo object paths).
        location @media_unavailable { return 502; }
        location @media_forbidden { return 403; }
        location @media_missing { return 404; }
        location @media_range { return 416; }
        location / { return 404; }
    }
}
