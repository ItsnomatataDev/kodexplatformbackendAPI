# REVIEW ONLY. Alternative gateway snippet, NOT an instruction to change live routing.
# Place these zones in the existing nginx http block. A single approved gateway must
# front ALL infrastructure replicas; independent gateways do not share these zones.
limit_req_zone $binary_remote_addr zone=infra_peer:1m rate=2r/s;
limit_req_zone $server_name zone=infra_global:1m rate=10r/s;

