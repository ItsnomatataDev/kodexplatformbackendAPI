# Isolated, disposable resources only. Never reads repository env files.
services:
  minio:
    image: pgsty/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: local-test-admin
      MINIO_ROOT_PASSWORD: local-test-admin-password
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 2s
      timeout: 2s
      retries: 30
  media-auth:
    build:
      context: ../..
      target: media-auth
    environment:
      MEDIA_PLAYBACK_SIGNING_SECRET: local-test-playback-key
      MEDIA_ORIGIN_ENDPOINT: http://minio:9000
      MEDIA_ORIGIN_BUCKET: content-review-assets
      MEDIA_ORIGIN_ACCESS_KEY: local-test-reader
      MEDIA_ORIGIN_SECRET_KEY: local-test-reader-password
  media-edge:
    image: nginx:1.28-alpine
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=67108864,mode=1777
    volumes:
      - ../../deploy/media-edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - cache:/var/cache/nginx
    depends_on:
      - media-auth
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 2s
      timeout: 2s
      retries: 30
  test:
    build:
      context: ../..
      target: media-worker
    user: root
    entrypoint: [node, /app/tests/media-cdn/run.mjs]
    volumes:
      - ./run.mjs:/app/tests/media-cdn/run.mjs:ro
    depends_on:
      minio:
        condition: service_healthy
      media-edge:
        condition: service_healthy
volumes:
  cache:
